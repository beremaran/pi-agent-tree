name: Publish to npm

on:
  push:
    tags:
      - "v*"
  # Allow re-running a publish for an existing tag (e.g. after a transient
  # failure). The tag ref must be supplied explicitly; every verification step
  # below still runs against that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
        type: string

# Minimal explicit permissions for this workflow:
#   contents: write - softprops/action-gh-release creates the GitHub Release
#   id-token: write - npm publish uses it for provenance attestation
permissions:
  contents: write
  id-token: write

# Serialize publishes of the same tag (push-tag or manual dispatch) and never
# cancel a publish already in progress.
concurrency:
  group: npm-publish-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Effective release tag: the pushed tag on tag pushes, or the manually
  # supplied tag on workflow_dispatch.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  guard:
    name: Guard release tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # On push-tag runs github.ref is already the tag; on workflow_dispatch
          # the tag comes from the required input.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Verify tag is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG" || {
            echo "::error::RELEASE_TAG is empty; cannot guard an untagged release." >&2
            exit 1
          }
          git fetch origin "$DEFAULT_BRANCH" --tags --force
          if ! git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $RELEASE_TAG is not an ancestor of the default branch ($DEFAULT_BRANCH); refusing to publish a tag created on a random branch." >&2
            exit 1
          fi
          echo "Tag $RELEASE_TAG is contained in $DEFAULT_BRANCH."

  publish:
    name: Publish
    needs: guard
    runs-on: ubuntu-latest

    # `secrets` is not available in step-level `if:` conditions, so the token
    # presence is evaluated at the job level and referenced via `env`.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify package and release tag
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          test "$PACKAGE_NAME" = "@beremaran/pi-agent-tree"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          # A release tag must have a matching CHANGELOG entry. "Unreleased"
          # is never a tag, so the version here is always concrete.
          grep -q "## $PACKAGE_VERSION" CHANGELOG.md || {
            echo "CHANGELOG.md has no entry for $PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Inspect package contents
        run: |
          # Assert the packed tarball contains exactly the expected files:
          # CHANGELOG.md, LICENSE, README.md, package.json, and the src/ modules.
          npm pack --dry-run --json > pack-info.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const [entry] = JSON.parse(readFileSync("pack-info.json", "utf8"))
            const actual = entry.files.map((f) => f.path).sort()
            const expected = [
              "CHANGELOG.md",
              "LICENSE",
              "README.md",
              "package.json",
              "src/agents.ts",
              "src/directive.ts",
              "src/index.ts",
              "src/options.ts",
              "src/subagent.ts",
            ].sort()
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              console.error("packed file mismatch")
              console.error("expected: " + expected.join(", "))
              console.error("actual:   " + actual.join(", "))
              process.exit(1)
            }
          '

      - name: Smoke-test packed tarball with pi
        run: |
          # Install the tarball in a clean consumer and load the extension with
          # pi itself. pi loads extensions through jiti, so this is the most
          # faithful smoke test: it proves the package resolves its peer
          # dependencies (pi core packages are auto-installed peers) and that
          # the raw-TypeScript entry loads under pi's real loader.
          REPO_ROOT="$PWD"
          TARBALL="$(npm pack --silent)"
          CONSUMER_DIR="$(mktemp -d)"
          cd "$CONSUMER_DIR"
          npm init -y
          npm install "$REPO_ROOT/$TARBALL"
          timeout 120 ./node_modules/.bin/pi -e node_modules/@beremaran/pi-agent-tree/src/index.ts --list-models

      - name: Extract CHANGELOG section for release body
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $ is intentional inside the single-quoted Node script
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs"
            const version = process.env.RELEASE_TAG.replace(/^v/, "")
            const text = readFileSync("CHANGELOG.md", "utf8")
            const header = "## " + version
            const start = text.indexOf(header)
            if (start === -1) {
              console.error(`no CHANGELOG section for ${version}`)
              process.exit(1)
            }
            // Skip the full heading line (e.g. "## 0.1.0 - 2026-08-05").
            const lineEnd = text.indexOf("\n", start)
            const from = lineEnd === -1 ? text.length : lineEnd + 1
            const next = text.indexOf("\n## ", from)
            const section = (next === -1 ? text.slice(from) : text.slice(from, next)).trim()
            writeFileSync("/tmp/release-body.md", section + "\n")
          '

      - name: Publish package
        # npm publish needs a valid NPM_TOKEN secret. Without it (e.g. first
        # push before the maintainer adds the token), the workflow skips the
        # publish but still creates the GitHub Release below.
        if: ${{ env.HAS_NPM_TOKEN }}
        run: npm publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: /tmp/release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
